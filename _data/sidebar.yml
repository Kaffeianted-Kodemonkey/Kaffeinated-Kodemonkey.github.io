# Sidebar sections. The first section whose prefix matches the page URL is shown.
# List the most specific sections first. To force a section on one page,
# add  nav_section: <id>  to that page's front matter.
sections:
  - id: articles
    title: Articles
    prefixes: ["/monkeyhub/articles/", "/article/"]
    links:
      - { title: "All articles", url: "/monkeyhub/articles/" }
      - { title: "WCAG Learning Center", url: "/monkeyhub/learning_center/" }
      - { title: "Resources", url: "/monkeyhub/resources/" }
      - { title: "Back to MonkeyHub", url: "/monkeyhub/" }

  - id: learning_center
    title: WCAG Learning Center
    prefixes: ["/monkeyhub/learning_center/"]
    links:
      - { title: "Learning Center home", url: "/monkeyhub/learning_center/" }
      - { title: "Start here", url: "/monkeyhub/learning_center/#start-here" }
      - { title: "WCAG in plain language", url: "/monkeyhub/learning_center/wcag/" }
      - { title: "Testing and audits", url: "/monkeyhub/learning_center/testing/" }
      - { title: "Design and content", url: "/monkeyhub/learning_center/design/" }
      - { title: "Development patterns", url: "/monkeyhub/learning_center/development/" }
      - { title: "Law and compliance", url: "/monkeyhub/learning_center/compliance/" }
      - { title: "Assistive technology", url: "/monkeyhub/learning_center/assistive_tech/" }
      - { title: "Back to MonkeyHub", url: "/monkeyhub/" }

  - id: monkeyhub
    title: MonkeyHub
    prefixes: ["/monkeyhub"]
    links:
      - { title: "MonkeyHub", url: "/monkeyhub/" }
      - { title: "Articles", url: "/monkeyhub/articles/" }
      - { title: "WCAG Learning Center", url: "/monkeyhub/learning_center/" }
      - { title: "Resources", url: "/monkeyhub/resources/" }
      - { title: "Support Ticket", url: "/support_ticket/" }

  - id: services
    title: Services
    prefixes: ["/services/"]
    links:
      - { title: "Web Accessibility Audits", url: "/services/web_accessibility_audits/" }
      - { title: "Accessibility Monitoring", url: "/services/accessibility_monitoring/" }
      - { title: "Accessible Web Design", url: "/services/accessibility_web_design/" }

  - id: policies
    title: Accessibility and policies
    prefixes: ["/a11y_policy/"]
    links:
      - { title: "ADA Compliance", url: "/a11y_policy/ada_compliance/" }
      - { title: "Accessibility Statement", url: "/a11y_policy/a11y_statement/" }
      - { title: "WCAG Report", url: "/a11y_policy/wcag_report/" }
      - { title: "Terms of Service", url: "/a11y_policy/tos/" }
      - { title: "Disclaimer", url: "/a11y_policy/disclaimer/" }
      - { title: "Privacy Policy", url: "/a11y_policy/privacy_policy/" }

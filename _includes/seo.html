<!-- Standard SEO Tags -->
<title>{% if page.title %}{{ page.title }} | Kaffeinated Kodemonkey{% else %}Kaffeinated Kodemonkey | Digital Accessibility Compliance{% endif %}</title>
<meta name="description" content="{{ page.description | default: page.meta_description | default: site.description | strip_html | strip_newlines | escape }}">

<!-- Open Graph / Facebook Meta Tags -->
<meta property="og:type" content="website">
<meta property="og:url" content="{{ canonical_url | default: page.url | absolute_url }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}Kaffeinated Kodemonkey{% endif %}">
<meta property="og:description" content="{{ page.description | default: page.meta_description | default: site.description | strip_html | strip_newlines | escape }}">
<meta property="og:image" content="{{ '/assets/img/KKM-Banner.png' | absolute_url }}">

<!-- Twitter Card Meta Tags -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:url" content="{{ canonical_url | default: page.url | absolute_url }}">
<meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}Kaffeinated Kodemonkey{% endif %}">
<meta name="twitter:description" content="{{ page.description | default: page.meta_description | default: site.description | strip_html | strip_newlines | escape }}">
<meta name="twitter:image" content="{{ '/assets/img/KKM-Banner.png' | absolute_url }}">

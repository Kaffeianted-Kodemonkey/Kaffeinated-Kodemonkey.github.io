<form action="https://formspree.io/f/mrbylyaq" method="post">
  <p id="contact-form-requirements" class="fs-6 text-muted">Fields marked <span class="text-danger">*</span> are required. If submission is blocked, complete the required fields identified below.</p>
  <div class="row g-3">
    <div class="col-md-6">
      <label for="contact-fname">First name (required)</label>
      <input
        id="contact-fname"
        type="text"
        name="fname"
        autocomplete="given-name"
        class="form-control form-control-sm"
        placeholder="First name"
        aria-label="First name"
        aria-describedby="contact-fname-required"
        required
      />
      <p id="contact-fname-required" class="fs-6 text-muted"><span class="text-danger">*</span> Required</p>
    </div>
    <div class="col-md-6">
      <label for="contact-lname">Last name (required)</label>
      <input
        id="contact-lname"
        type="text"
        name="lname"
        autocomplete="family-name"
        class="form-control form-control-sm"
        placeholder="Last name"
        aria-label="Last name"
        aria-describedby="contact-lname-required"
        required
      />
      <p id="contact-lname-required" class="fs-6 text-muted"><span class="text-danger">*</span> Required</p>
    </div>
    <div class="col-md-6">
      <label for="contact-email">Email</label>
      <input
        id="contact-email"
        type="email"
        name="email"
        autocomplete="email"
        class="form-control form-control-sm"
        placeholder="Email"
        aria-label="Email"
        aria-describedby="contact-email-required"
        required
      />
      <p id="contact-email-required" class="fs-6 text-muted"><span class="text-danger">*</span> Required</p>
    </div>
    <div class="col-md-6">
      <label for="contact-phone">Phone (optional)</label>
      <input
        id="contact-phone"
        type="tel"
        name="phone"
        autocomplete="tel"
        class="form-control form-control-sm"
        placeholder="Phone (optional)"
        aria-label="Phone (optional)"
      />
      <p class="fs-6 text-muted">Optional</p>
    </div>
    <div class="col-md-12 mt-0 mb-4">
      <label for="contact-services">Services</label>
      <select id="contact-services" name="Services" class="form-select" aria-label="Services" aria-describedby="contact-services-required" required>
        <option value="" disabled selected>Select a Service</option>
        <option value="pv">POCC/VPAT</option>
        <option value="am">A11y Monitoring</option>
        <option value="wd">POUR Web Design</option>
        <option value="other">Other</option>
      </select>
      <p id="contact-services-required" class="fs-6 text-muted"><span class="text-danger">*</span> Required</p>
    </div>
    <div class="col-md-12 mt-0">
      <label for="contact-message">Message</label>
      <textarea aria-label="Message"
        id="contact-message"
        name="message"
        class="form-control"
        placeholder="Leave us a Message"
        rows="5"
        style="width: 100%;"
      ></textarea>
    </div>
    <div class="col-md-12">
      <p><button type="submit" class="btn btn-md btn-primary">Discuss My Project</button></p>
    </div>
  </div>
</form>

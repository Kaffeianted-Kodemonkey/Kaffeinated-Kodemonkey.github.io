{% assign url = page.url %}
{% assign pcat = page.categories %}
<!--<h2>{{pcat}}</h2>-->
<hr>

{% if pcat != "MonkeyHub" and pcat != "series" %}
<ul class="fs-5">
  {% assign sort_pages = site.pages | sort: "nav_order" %}
  {% for p in sort_pages %}
    {% if p.categories contains pcat %}
      <li>
        <a href="{{ p.url }}" {% if p.url == url %}class="isDisabled"{% endif %}>
          {{ p.title }}
        </a>
      </li>
    {% endif %}
  {% endfor %}
</ul>
<hr />
{% endif %}
